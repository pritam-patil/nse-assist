# nse-assist dividend backtester — Burst 0 output
# Statutory rates pre-filled as of Aug 2026 — re-verify after each Union Budget.

universe:
  equity_master: data/EQUITY_L.csv
  nifty500_list: data/ind_nifty500list.csv

validation_events:            # burst 2 sanity sample — verify before trusting
  - {symbol: COALINDIA, ex_date: 2025-08-06, amount: 5.50}   # interim, as reported
  - {symbol: BLUEDART,  ex_date: 2025-08-06, amount: 25.00}  # FY25 final, as reported
  - {symbol: BAYERCROP, ex_date: 2025-08-07, amount: 35.00}  # FY25, as reported

frictions:
  brokerage:
    delivery_buy_inr: 0    # your broker's schedule (flat ₹ or %; many are 0)
    delivery_sell_inr: 0
  stt_delivery_pct: 0.1       # % of turnover, both sides
  stamp_duty_buy_pct: 0.015   # buy side only
  exchange_txn_pct: 0.00297   # NSE equity delivery
  sebi_fee_pct: 0.0001
  gst_pct: 18                 # on brokerage + txn charges + DP
  dp_charge_per_sell_inr: 13  # per scrip per day, ~₹13–20 + GST; broker charge sheet
  slippage_bps: 10            # assumption; burst 7 stresses at 2x and 3x

tax:
  dividend_slab_pct: 31.2     # your marginal rate, e.g. 30
  tds_threshold_inr: 10000    # per company per FY
  apply_section_94_7: true    # conservative default. 94(7): buy ≤3 months before
                              # record date AND sell ≤3 months after → capital loss
                              # disallowed up to dividend amount. Post-2020
                              # applicability is debated — keep true, and run
                              # burst 6 with it flipped to price the debate.

backtest:
  entry_days_before: [20, 15, 10, 5, 3, 1, 0]
  exit_days_after: [0, 1, 3, 5, 10]
  notional_per_trade_inr: 100000
  train_until: 2022-12-31     # events after this are out-of-sample
