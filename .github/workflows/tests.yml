name: tests

# The point-in-time suite is the project's main defence against lookahead bias, so
# it runs on every push rather than on a schedule. A backtest that peeks forward
# does not fail loudly — this is the thing that makes it fail at all.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -t . -v
      # Belt and braces: the pre-commit hook only protects a machine that ran
      # `git config core.hooksPath .githooks`. CI protects the repository.
      - run: python -m src.secrets_guard --tracked
