name: morning

# 02:20 UTC = 07:50 IST, weekdays. 85 minutes before the 09:15 IST open.
#
# WHY SO EARLY, AND WHY NOT ON THE HOUR
#
# GitHub gives no delivery guarantee on `schedule` — the docs say runs are delayed
# during periods of high load, which is worst at the top of every hour. Measured
# here on 2026-08-03: this workflow was scheduled for 03:15 UTC and ran at 06:37,
# three hours and twenty-two minutes late. That put a brief written to be read
# before the open into the middle of the session, describing fills that had
# already happened.
#
# So: earlier, for slack, and off the hour to avoid the worst of the contention.
# 85 minutes absorbs a delay that would have landed the old schedule post-open.
#
# THE CRON IS NOT THE FIX, IT IS THE MARGIN. No schedule can be relied on, so the
# brief states the IST time it was generated and says so plainly when the market
# has already opened — see src/brief.py. A late brief that admits it is late is
# usable; a late brief that reads like a pre-open one is not.

on:
  schedule:
    - cron: "20 2 * * 1-5"
  workflow_dispatch:

concurrency:
  group: nse-assist-state
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment: prod
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Check the secrets are actually populated
        run: |
          missing=""
          [ -n "$TELEGRAM_BOT_TOKEN" ] || missing="$missing TELEGRAM_BOT_TOKEN"
          [ -n "$TELEGRAM_CHAT_ID" ] || missing="$missing TELEGRAM_CHAT_ID"
          if [ -n "$missing" ]; then
            echo "::error::empty secret(s):$missing — defined-but-unmapped secrets arrive blank"
            exit 1
          fi

      - name: Is there a session today?
        id: calendar
        run: |
          python - <<'PY'
          import os, sys
          from datetime import datetime, timedelta, timezone
          from src import holidays_2026 as calendar

          # 03:15 UTC is 08:45 IST the SAME day, but the UTC date and the IST date
          # diverge for any schedule before 18:30 UTC. Computing in IST is what makes
          # the brief describe the session it is actually about to precede.
          day = (datetime.now(timezone.utc) + timedelta(hours=5, minutes=30)).date()
          try:
              trading = calendar.is_trading_day(day)
          except RuntimeError as exc:
              print(f"::error::{exc}")
              sys.exit(1)
          with open(os.environ["GITHUB_OUTPUT"], "a") as handle:
              handle.write(f"trading={'true' if trading else 'false'}\n")
          print(f"{day}: {'session' if trading else calendar.describe(day)}")
          PY

      - name: Send the brief
        if: steps.calendar.outputs.trading == 'true'
        run: python main.py --stage brief

      - name: Alert on failure
        if: failure()
        run: |
          curl -sS --max-time 20 \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=nse-assist morning brief FAILED.
          ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          No brief was sent before today's open. Last night's proposals are still in
          the database; run --stage brief manually to see them." > /dev/null
