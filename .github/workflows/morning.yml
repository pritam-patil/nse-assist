name: morning

# THREE SLOTS, RE-MEASURED 2026-09-23. A single 00:20 UTC slot (05:50 IST, moved
# there 2026-08-05 from an earlier 02:20 UTC — the comment explaining THAT move
# went stale and said 85 minutes of margin when the real gap was 3h25m) turned out
# not to be a margin problem at all. It was firing on a schedule of its own:
# every one of the last 15 runs (2026-09-03 through 2026-09-23, `gh run list
# --workflow=morning.yml`) landed between 04:37 and 05:00 UTC — a 23-minute
# window, every single weekday, regardless of the 00:20 UTC trigger — which is
# 10:07-10:30 IST, AFTER the 09:15 open every single time. Not occasional drift;
# a near-constant ~4.3-4.7 hour delay on this specific slot, consistently, for
# three weeks straight.
#
# You cannot out-margin a delay that consistent by nudging one cron earlier —
# 2026-08-05 already tried that (2 hours earlier) and the ACTUAL landing time
# barely moved, because the delay is not "N minutes of congestion", it behaves
# like a near-fixed offset for this slot. So this schedules two NEW slots far
# enough back, in UTC terms, to land before the open even at the worst end of
# the observed 4.28-4.67 hour range (verified by simulating both bounds against
# real calendar dates — see the commit that added these), plus keeps the
# original slot as a last-resort catch-up that we already know reliably fires,
# just late:
#
#   20:50 UTC (prev day, Sun-Thu) -> lands ~01:07-01:30 UTC = 06:37-07:00 IST,
#                                     2h15m-2h38m before the open
#   22:20 UTC (prev day, Sun-Thu) -> lands ~02:37-03:00 UTC = 08:07-08:30 IST,
#                                     45m-1h08m before the open (the backup)
#   00:20 UTC (same day, Mon-Fri) -> the original slot, ~10:07-10:30 IST,
#                                     after the open — proven to fire, kept as
#                                     a floor under the other two, not the plan
#
# WHY "Sun-Thu" FOR THE FIRST TWO. They fire late the PREVIOUS UTC calendar day
# to land early on the IST day they are for — a slot covering Monday's brief
# schedules on Sunday (cron weekday 0), not Monday. Get this backward and a
# whole session's mornings go silent rather than late, which is worse. The
# safety net if this reasoning is ever wrong in some edge case: "Is there a
# session today?" below computes the trading day from the REAL clock at
# execution time, not from which cron entry fired it, so a slot landing on an
# unexpected day still correctly checks against reality before sending anything.
#
# THREE SCHEDULED RUNS A MORNING IS SAFE NOW, NOT JUST TOLERATED. Before this,
# a second slot the same morning would have resent the identical brief — see
# BRIEF_DELIVERED_KEY in src/brief.py, added alongside this schedule change
# specifically so redundant slots are free instead of spammy, the same
# guard deliver.py already had for the evening report.
#
# A GUARD THAT LIVES IN THE DATABASE ONLY WORKS IF THE DATABASE IS COMMITTED.
# This workflow originally had no commit step, so every slot started from a
# checkout that had never heard of the previous one's send: measured 2026-10-07
# and 2026-10-08, all three slots logged "[brief] sent", every morning. The
# commit step below keeps the database only when the brief marker moved — the
# same before/after test poll.yml uses for its offset — so a redundant slot
# leaves no commit behind.
#
# THE CRON IS STILL NOT THE FIX, IT IS THE MARGIN. No schedule can be relied
# on, so the brief states the IST time it was generated and says so plainly
# when the market has already opened — see timing_note() in src/brief.py. A
# late brief that admits it is late is usable; one that reads like an
# on-time one is not.

on:
  schedule:
    - cron: "50 20 * * 0-4"
    - cron: "20 22 * * 0-4"
    - cron: "20 0 * * 1-5"
  workflow_dispatch:

concurrency:
  group: nse-assist-state
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment: prod
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Check the secrets are actually populated
        run: |
          missing=""
          [ -n "$TELEGRAM_BOT_TOKEN" ] || missing="$missing TELEGRAM_BOT_TOKEN"
          [ -n "$TELEGRAM_CHAT_ID" ] || missing="$missing TELEGRAM_CHAT_ID"
          if [ -n "$missing" ]; then
            echo "::error::empty secret(s):$missing — defined-but-unmapped secrets arrive blank"
            exit 1
          fi

      - name: Is there a session today?
        id: calendar
        run: |
          python - <<'PY'
          import os, sys
          from datetime import datetime, timedelta, timezone
          from src import holidays_2026 as calendar

          # 03:15 UTC is 08:45 IST the SAME day, but the UTC date and the IST date
          # diverge for any schedule before 18:30 UTC. Computing in IST is what makes
          # the brief describe the session it is actually about to precede.
          day = (datetime.now(timezone.utc) + timedelta(hours=5, minutes=30)).date()
          try:
              trading = calendar.is_trading_day(day)
          except RuntimeError as exc:
              print(f"::error::{exc}")
              sys.exit(1)
          with open(os.environ["GITHUB_OUTPUT"], "a") as handle:
              handle.write(f"trading={'true' if trading else 'false'}\n")
          print(f"{day}: {'session' if trading else calendar.describe(day)}")
          PY

      - name: Send the brief
        if: steps.calendar.outputs.trading == 'true'
        run: |
          marker() {
            python -c "from src.brief import BRIEF_DELIVERED_KEY; \
          from src.db import get_connection, get_state; \
          print(get_state(get_connection(), BRIEF_DELIVERED_KEY))"
          }
          before=$(marker)
          python main.py --stage brief
          after=$(marker)

          # Keep the database only if this slot is the one that sent. A slot that
          # found the brief already sent still wrote run-log rows, and committing
          # those three times a morning would record nothing but that it ran.
          if [ "$before" = "$after" ]; then
            echo "brief not sent by this slot — discarding the run-log churn"
            git checkout -- output/nse.db
          fi

      - name: Commit the delivery marker
        # always(): a brief that sent and then failed later in the step still
        # needs its marker recorded, or the next slot sends it again.
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f output/nse.db ]; then git add -f output/nse.db; fi
          if git diff --quiet --cached; then
            echo "no state change to record"
            exit 0
          fi
          git commit -m "state: $(date -u +%Y-%m-%d) morning"
          # Commit BEFORE pulling — --rebase refuses a dirty tree.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Alert on failure
        if: failure()
        run: |
          curl -sS --max-time 20 \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=nse-assist morning brief FAILED.
          ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          No brief was sent before today's open. Last night's proposals are still in
          the database; run --stage brief manually to see them." > /dev/null
