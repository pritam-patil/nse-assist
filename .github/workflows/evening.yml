name: evening

# 14:00 UTC = 19:30 IST, weekdays. After the 15:30 close, with room for one retry
# if NSE publishes the bhavcopy late.
#
# CRONS ARE UTC. GitHub has no timezone setting, so a cron written as though it were
# IST fires five and a half hours early — 09:00 IST, during the session it is meant
# to run after. Every schedule in this repo states both times.
#
# ORDER MATTERS. ingest -> funds -> features -> signals -> journal -> deliver.
# Signals read features, journal fills from signals, delivery reports the ledger.
# The AMFI pull sits in this same chain rather than on its own schedule: a separate
# cron for it is exactly how fund_navs goes stale for a fortnight while every run
# reports success.
#
# Budget: two short runs a day is roughly 120-180 minutes a month. Nothing to
# optimise, and no reason to make the repo public for minutes.

on:
  schedule:
    # THREE SLOTS, NOT ONE. GitHub's `schedule` is best-effort — the docs say
    # events may be delayed or dropped under load, and measured here on
    # 2026-08-03 that is not a rare edge: roughly 25 of 29 poll slots produced
    # nothing at all, and this workflow's single 14:00 slot never fired on its
    # first scheduled day. Everything that did fire was 25 minutes to 3h22 late.
    #
    # 14:00 UTC is 19:30 IST, 4 hours after the close. The retries are 15:07 and
    # 16:13 — off the hour, where contention is worst, and spread rather than
    # adjacent so a busy period does not swallow all three.
    #
    # The chain is idempotent, so a retry after a successful run is a no-op:
    # ingest fetches forward from its watermark, signals skip what is already
    # proposed, journal is INSERT OR IGNORE. The one thing that is NOT idempotent
    # is your attention, which is why deliver.py guards on the session it last
    # reported — three identical reports an hour apart is how the evening report
    # stops being read.
    - cron: "0 12 * * 1-5"
    - cron: "7 13 * * 1-5"
    - cron: "13 15 * * 1-5"
  workflow_dispatch:

# Shared with morning.yml and sunday.yml. All three commit output/nse.db, so they
# must never interleave. cancel-in-progress is false because a cancelled evening run
# can lose a session outright — ingest only fetches forward from the stored
# watermark, and the watermark never advanced.
concurrency:
  group: nse-assist-state
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment: prod
    # Mapped explicitly. A secret referenced but never defined arrives as an empty
    # string rather than an error, so the guard below tests for emptiness instead of
    # trusting that the mapping worked.
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # Optional. Absent, the sentiment stage no-ops — it is observational and
      # nothing downstream reads it, so a missing key must not fail the run.
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Check the secrets are actually populated
        run: |
          missing=""
          [ -n "$TELEGRAM_BOT_TOKEN" ] || missing="$missing TELEGRAM_BOT_TOKEN"
          [ -n "$TELEGRAM_CHAT_ID" ] || missing="$missing TELEGRAM_CHAT_ID"
          if [ -n "$missing" ]; then
            echo "::error::empty secret(s):$missing — defined-but-unmapped secrets arrive blank"
            exit 1
          fi

      - name: Was today a session?
        id: calendar
        run: |
          python - <<'PY'
          import os, sys
          from datetime import datetime, timedelta, timezone
          from src import holidays_2026 as calendar

          # IST, not the runner's UTC. They agree at 14:00, but stating it stops a
          # later schedule change from silently shifting the date.
          day = (datetime.now(timezone.utc) + timedelta(hours=5, minutes=30)).date()
          try:
              trading = calendar.is_trading_day(day)
          except RuntimeError as exc:
              # Loud, never skipped. An uncovered year would otherwise turn every run
              # into a no-op forever, and a pipeline quietly doing nothing looks
              # exactly like one with nothing to do.
              print(f"::error::{exc}")
              sys.exit(1)
          with open(os.environ["GITHUB_OUTPUT"], "a") as handle:
              handle.write(f"trading={'true' if trading else 'false'}\n")
          print(f"{day}: {'session' if trading else calendar.describe(day)}")
          PY

      - name: Ingest prices, retrying once if the bhavcopy is late
        id: ingest
        if: steps.calendar.outputs.trading == 'true'
        run: |
          set +e
          python main.py --stage ingest --require-bhavcopy && exit 0
          echo "::notice::bhavcopy not published yet; waiting 30 minutes for one retry"
          sleep 1800
          python main.py --stage ingest --require-bhavcopy && exit 0
          echo "::warning::bhavcopy still unavailable — accepting the yfinance fallback"
          set -e
          python main.py --stage ingest

      # No holiday gate: fund NAVs do not follow the equity calendar. Liquid schemes
      # price on days the exchange is shut, so gating this would drop observations
      # for exactly the funds cash is parked in.
      #
      # DELIBERATELY ALLOWED TO FAIL WITHOUT BLOCKING WHAT FOLLOWS. Measured
      # 2026-09-22: AMFI timed out for the one evening slot that fired that day
      # (GitHub's own scheduling drift meant it was the only slot — see the
      # THREE SLOTS comment above), and because this step had no `continue`
      # story, Features/Signals/Journal/Deliver all silently skipped — the
      # whole evening report was lost to a fund-NAV outage that had nothing to
      # do with equity prices, which had ingested fine. Funds still fails
      # loudly here (no continue-on-error, no `|| true` — this is a real
      # problem worth the Telegram alert below), it just no longer gates the
      # stages that never depended on it.
      - name: Ingest fund NAVs and refresh metrics
        id: funds
        run: python main.py --stage funds

      # always() + an explicit ingest check, not the bare calendar condition
      # that used to sit here: GitHub Actions implicitly ANDs any `if:` with
      # success() unless the expression itself opens with always()/failure()/
      # etc, so `if: steps.calendar.outputs.trading == 'true'` alone silently
      # means "AND nothing before this has failed" — which is what let the
      # funds failure above cascade. ingest failing must still gate this
      # (there is no signal to compute without today's prices); funds failing
      # must not.
      - name: Features
        if: >
          always() && steps.calendar.outputs.trading == 'true' &&
          steps.ingest.outcome != 'failure'
        run: python main.py --stage features

      - name: Signals
        if: >
          always() && steps.calendar.outputs.trading == 'true' &&
          steps.ingest.outcome != 'failure'
        run: python main.py --stage signals

      # Observational only, and after assembly by design: it scores the candidates
      # that survived, not every rule firing. `|| true` because a free RSS feed or
      # a rate-limited LLM must never cost the evening report — the stage already
      # swallows its own errors, and this is the belt to that pair of braces.
      - name: Sentiment (observational, non-blocking)
        if: >
          always() && steps.calendar.outputs.trading == 'true' &&
          steps.ingest.outcome != 'failure'
        run: python main.py --stage sentiment || true

      - name: Journal
        if: >
          always() && steps.calendar.outputs.trading == 'true' &&
          steps.ingest.outcome != 'failure'
        run: python main.py --stage journal

      - name: Deliver the evening report
        if: >
          always() && steps.calendar.outputs.trading == 'true' &&
          steps.ingest.outcome != 'failure'
        run: python main.py --stage deliver

      - name: Commit the state file
        # always(): whatever did land — bars, NAVs, the run log itself — is exactly
        # what you want to inspect after a partial failure.
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Rebase first. Three workflows write this file; a rejected push here loses
          # the session rather than retrying it.
          # Tolerant of absence: a stage can fail before the database is created,
          # and `git add` on a missing path is a hard error that would then mask
          # the real failure with a pathspec message.
          if [ -f output/nse.db ]; then git add -f output/nse.db; fi
          # Nothing to record is the common case, and it is not a failure.
          if git diff --quiet --cached; then
            echo "no state change to record"
            exit 0
          fi
          git commit -m "state: $(date -u +%Y-%m-%d) evening"
          # Commit BEFORE pulling. `git pull --rebase` refuses to run against a
          # dirty tree, and the tree is dirty by construction here — the stages
          # above write to the database this step exists to commit.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Alert on failure
        if: failure()
        env:
          INGEST_OUTCOME: ${{ steps.ingest.outcome }}
          FUNDS_OUTCOME: ${{ steps.funds.outcome }}
        run: |
          # Which step actually failed changes both the severity and the fix —
          # see the comment above the funds step. Distinguishing them here is
          # what the 2026-09-22 incident was missing: a funds-only failure
          # still delivers the real evening report, and a message implying
          # otherwise trains you to ignore this alert.
          if [ "$INGEST_OUTCOME" = "failure" ]; then
            detail="Today's prices are missing. Ingest only fetches forward from the
          stored watermark, so this needs a manual backfill rather than fixing itself
          tomorrow. Nothing downstream ran — no signals, no report."
          elif [ "$FUNDS_OUTCOME" = "failure" ]; then
            detail="Only fund NAVs failed to update (AMFI unreachable or its format
          changed again — check the step log). Prices, signals and the evening report
          went out normally; this just means fund_navs/parked-cash metrics are stale
          until the next successful run."
          else
            detail="Prices and NAVs both look fine — something later in the chain
          broke (features, signals, journal or delivery). Check the run log."
          fi
          curl -sS --max-time 20 \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=nse-assist evening run FAILED.
          ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          $detail" > /dev/null
