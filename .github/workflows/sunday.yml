name: sunday

# 14:00 UTC = 19:30 IST on Sunday, the same clock time as the weekday evening run so
# there is one hour to remember rather than two.
#
# Exists because fund NAVs do not follow the equity calendar. Liquid and overnight
# schemes price every day of the week; a Monday-to-Friday schedule would miss two
# observations in seven for exactly the funds cash is parked in. Measured on the
# current watchlist: 325 NAVs a year for the liquid scheme against 240 for the
# business-day ones.

on:
  schedule:
    - cron: "0 14 * * 0"
  workflow_dispatch:

concurrency:
  group: nse-assist-state
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment: prod
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      FUND_SCHEME_CODES: ${{ vars.FUND_SCHEME_CODES }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Check the secrets are actually populated
        run: |
          missing=""
          [ -n "$TELEGRAM_BOT_TOKEN" ] || missing="$missing TELEGRAM_BOT_TOKEN"
          [ -n "$TELEGRAM_CHAT_ID" ] || missing="$missing TELEGRAM_CHAT_ID"
          if [ -n "$missing" ]; then
            echo "::error::empty secret(s):$missing — defined-but-unmapped secrets arrive blank"
            exit 1
          fi

      # No calendar gate at all: the point of this run is the schemes that price on
      # days the exchange is shut.
      - name: Ingest fund NAVs and refresh metrics
        run: python main.py --stage funds

      # The weekly message. journal-report stays a manual stage — it prints the same
      # ledger numbers to a terminal, and sending both would be the same content
      # twice.
      # Read-only, no network, seconds over the whole universe. Its headline
      # finding is also gated by doctor's `discontinuity` check, but that reports
      # only a count — this prints the gaps, bad rows and jumps themselves, which
      # is what you need the moment the count stops being zero.
      - name: Verify stored data
        run: python main.py --stage verify-data

      - name: Weekly report
        run: python main.py --stage weekly

      - name: Commit the state file
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Tolerant of absence: a stage can fail before the database is created,
          # and `git add` on a missing path is a hard error that would then mask
          # the real failure with a pathspec message.
          if [ -f output/nse.db ]; then git add -f output/nse.db; fi
          # Nothing to record is the common case, and it is not a failure.
          if git diff --quiet --cached; then
            echo "no state change to record"
            exit 0
          fi
          git commit -m "state: $(date -u +%Y-%m-%d) sunday"
          # Commit BEFORE pulling. `git pull --rebase` refuses to run against a
          # dirty tree, and the tree is dirty by construction here — the stages
          # above write to the database this step exists to commit.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Alert on failure
        if: failure()
        run: |
          curl -sS --max-time 20 \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=nse-assist Sunday run FAILED.
          ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          Weekend fund NAVs may be missing. AMFI serves only the current dump, so a
          missed weekend cannot be recovered from it later." > /dev/null
